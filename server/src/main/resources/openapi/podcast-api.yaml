openapi: 3.1.0
info:
  title: Podcast API
  version: "1"
  description: |
    API hypermédia du service de podcasts.

    - Conventions (liens, actions, pagination, erreurs) : `docs/api/conventions.md`.
    - Chaque réponse JSON existe en `application/hal+json` (lecture seule) et en
      `application/prs.hal-forms+json` (avec les actions possibles dans `_templates`).
    - Un client ne connaît que la racine `/` et suit les liens.

    Les tests de contrat de `:server` vérifient que cette spécification et les routes
    réelles correspondent, et valident chaque réponse contre son schéma.
servers:
  - url: http://localhost:8080
    description: Serveur de développement
tags:
  - name: racine
  - name: authentification
  - name: abonnements
  - name: podcasts
  - name: épisodes
  - name: file d'attente
  - name: comptes
  - name: partages
security:
  - bearer: []
  - session: []

paths:
  /:
    get:
      tags: [racine]
      operationId: getRoot
      summary: Point d'entrée et Accueil
      description: |
        Anonyme : nom du serveur et moyen de se connecter (`tokens`, template `create-token`).
        Connecté : liens vers les collections de l'utilisateur et état de l'Accueil embarqué.
        Un navigateur (`text/html`) non connecté est redirigé vers `/login`.
      security: [{}, { bearer: [] }, { session: [] }]
      responses:
        "200":
          description: Racine
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Root" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/Root" }
            text/html:
              schema: { type: string }
        "303":
          description: Navigateur non connecté, redirigé vers `/login`.

  /auth/tokens:
    post:
      tags: [authentification]
      operationId: createToken
      summary: Échanger identifiant et mot de passe contre un jeton d'appareil
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "201":
          description: Jeton créé. Sa valeur n'est renvoyée qu'une fois.
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /auth/tokens/current:
    delete:
      tags: [authentification]
      operationId: revokeCurrentToken
      summary: Révoquer le jeton utilisé pour cette requête (déconnexion de l'appareil)
      security: [{ bearer: [] }]
      responses:
        "204": { description: Jeton révoqué }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me:
    get:
      tags: [comptes]
      operationId: getMe
      summary: Utilisateur connecté (templates `update-profile`, `change-password`, `logout`)
      responses:
        "200":
          description: Utilisateur
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/User" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [comptes]
      operationId: updateProfile
      summary: Changer son nom affiché (template `update-profile`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: Profil modifié
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/User" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /me/password:
    put:
      tags: [comptes]
      operationId: changePassword
      summary: Changer son mot de passe (template `change-password`)
      description: |
        Le mot de passe actuel est exigé, et les essais sont limités comme à la connexion.
        Les autres appareils et sessions doivent se reconnecter ; celui qui fait la demande reste connecté.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Mot de passe changé }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /me/devices:
    get:
      tags: [comptes]
      operationId: listDevices
      summary: Appareils connectés au compte (un jeton chacun)
      responses:
        "200":
          description: Appareils, du plus récemment utilisé au plus ancien
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/DeviceCollection" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/DeviceCollection" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/devices/{deviceId}:
    parameters:
      - $ref: "#/components/parameters/deviceId"
    delete:
      tags: [comptes]
      operationId: revokeDevice
      summary: Déconnecter un appareil (template `revoke`), par exemple un téléphone perdu
      responses:
        "204": { description: Jeton de l'appareil révoqué }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users:
    get:
      tags: [comptes]
      operationId: listUsers
      summary: Comptes du serveur, pour choisir avec qui partager
      description: Un administrateur reçoit aussi le template `create-user`.
      responses:
        "200":
          description: Comptes
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/UserCollection" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/UserCollection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [comptes]
      operationId: createUser
      summary: Créer un compte (administrateur, template `create-user`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Compte créé
          headers:
            Location:
              schema: { type: string }
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/User" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/userId"
    get:
      tags: [comptes]
      operationId: getUser
      summary: Un compte (un administrateur reçoit `update-user`, `reset-password` et `delete-user`)
      responses:
        "200":
          description: Compte
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/User" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [comptes]
      operationId: updateUser
      summary: Renommer un compte ou changer son rôle (administrateur, template `update-user`)
      description: Le serveur garde toujours au moins un administrateur.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Compte modifié
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/User" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [comptes]
      operationId: deleteUser
      summary: Supprimer un compte (administrateur, template `delete-user`), sauf le sien
      description: Ses abonnements, états d'écoute, partages et appareils disparaissent avec lui, ainsi que les podcasts que plus personne ne suit.
      responses:
        "204": { description: Compte supprimé }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userId}/password:
    parameters:
      - $ref: "#/components/parameters/userId"
    put:
      tags: [comptes]
      operationId: resetPassword
      summary: Définir un nouveau mot de passe (administrateur, template `reset-password`)
      description: Le compte est déconnecté de tous ses appareils et sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordReset" }
      responses:
        "204": { description: Mot de passe défini }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /subscriptions:
    get:
      tags: [abonnements]
      operationId: listSubscriptions
      summary: Abonnements de l'utilisateur
      responses:
        "200":
          description: Abonnements, par titre de podcast
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/SubscriptionCollection" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/SubscriptionCollection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [abonnements]
      operationId: createSubscription
      summary: S'abonner à un flux RSS (template `subscribe`)
      description: |
        Le serveur lit le flux tout de suite : un podcast n'existe que si son flux a pu être lu.
        Le podcast est mutualisé ; s'abonner à un flux déjà connu ne le relit pas.
        Sans schéma, l'adresse est complétée en `https://`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionRequest" }
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/SubscriptionRequest" }
      responses:
        "201":
          description: Abonnement créé
          headers:
            Location:
              schema: { type: string }
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Subscription" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "200":
          description: Déjà abonné à ce flux
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Subscription" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/FeedRejected" }

  /subscriptions/opml:
    get:
      tags: [abonnements]
      operationId: exportOpml
      summary: Exporter les abonnements en OPML 2.0
      responses:
        "200":
          description: Fichier OPML, en pièce jointe `podcasts.opml`
          content:
            text/x-opml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [abonnements]
      operationId: importOpml
      summary: Importer un fichier OPML (AntennaPod, Apple Podcasts…)
      description: |
        Instantané : les podcasts inconnus sont créés avec le titre de l'OPML (`refreshStatus: PENDING`)
        et leur flux est lu en arrière-plan. Les adresses refusées (schéma, réseau privé) sont listées
        dans `failed`. Au plus 1 000 flux et 5 Mo.
      requestBody:
        required: true
        content:
          text/x-opml:
            schema: { type: string }
          application/xml:
            schema: { type: string }
          text/xml:
            schema: { type: string }
          multipart/form-data:
            schema:
              type: object
              properties:
                opml: { type: string, format: binary }
      responses:
        "200":
          description: Rapport d'import
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/OpmlImportReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "Pas un fichier OPML lisible (`type` : `/problems/not-an-opml`)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /subscriptions/{subscriptionId}:
    parameters:
      - $ref: "#/components/parameters/subscriptionId"
    patch:
      tags: [abonnements]
      operationId: updateSubscription
      summary: Annoter un abonnement ou régler le téléchargement automatique (template `update`)
      description: |
        Mise à jour partielle ; un champ absent garde sa valeur, `"note": null` efface la note.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionUpdate" }
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/SubscriptionUpdate" }
      responses:
        "200":
          description: Abonnement modifié
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Subscription" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [abonnements]
      operationId: deleteSubscription
      summary: Se désabonner (template `unsubscribe`)
      description: Quand plus personne ne suit le podcast, il est supprimé avec ses épisodes et ses fichiers.
      responses:
        "204": { description: Désabonné }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [abonnements]
      operationId: getSubscription
      summary: Un abonnement
      responses:
        "200":
          description: Abonnement
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Subscription" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /search:
    get:
      tags: [podcasts]
      operationId: searchPodcasts
      summary: Chercher des podcasts dans les annuaires (via le serveur)
      description: |
        Le serveur interroge en parallèle Apple Podcasts et, si ses clés sont configurées, Podcast Index.
        Les résultats sont fusionnés sans doublon (même flux). Un annuaire en panne est ignoré ;
        `sources` liste ceux qui ont répondu. Chaque résultat non suivi porte un template `subscribe`
        prérempli avec l'adresse de son flux.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 200 }
      responses:
        "200":
          description: Résultats
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/SearchResults" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/SearchResults" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502":
          description: "Aucun annuaire n'a répondu (`type` : `/problems/search-failed`)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /podcasts/{podcastId}:
    parameters:
      - $ref: "#/components/parameters/podcastId"
    get:
      tags: [podcasts]
      operationId: getPodcast
      summary: Un podcast du catalogue
      responses:
        "200":
          description: Podcast
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Podcast" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/Podcast" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /podcasts/{podcastId}/refresh:
    parameters:
      - $ref: "#/components/parameters/podcastId"
    post:
      tags: [podcasts]
      operationId: refreshPodcast
      summary: Relire le flux maintenant (template `refresh`)
      description: Un échec n'est pas une erreur HTTP ; il se lit dans `refreshStatus`.
      responses:
        "200":
          description: Podcast après la lecture du flux
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Podcast" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/Podcast" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /podcasts/{podcastId}/episodes:
    parameters:
      - $ref: "#/components/parameters/podcastId"
    get:
      tags: [podcasts]
      operationId: listPodcastEpisodes
      summary: Épisodes d'un podcast, du plus récent au plus ancien, avec l'état de l'utilisateur
      parameters:
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Page d'épisodes
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/EpisodeCollection" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/EpisodeCollection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /episodes:
    get:
      tags: [épisodes]
      operationId: listEpisodes
      summary: Épisodes des abonnements de l'utilisateur, du plus récent au plus ancien
      parameters:
        - name: status
          in: query
          description: Ne garder que les épisodes dans cet état (pour l'utilisateur).
          schema: { $ref: "#/components/schemas/EpisodeStatus" }
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Page d'épisodes
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/EpisodeCollection" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/EpisodeCollection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /episodes/{episodeId}:
    parameters:
      - $ref: "#/components/parameters/episodeId"
    get:
      tags: [épisodes]
      operationId: getEpisode
      summary: Un épisode, avec l'état de l'utilisateur et les actions possibles
      responses:
        "200":
          description: Épisode
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Episode" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/Episode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /episodes/{episodeId}/progress:
    parameters:
      - $ref: "#/components/parameters/episodeId"
    put:
      tags: [épisodes]
      operationId: updateProgress
      summary: Enregistrer la position d'écoute (template `update-progress`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgressRequest" }
      responses:
        "204": { description: Position enregistrée, l'épisode est en cours d'écoute }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /episodes/{episodeId}/played:
    parameters:
      - $ref: "#/components/parameters/episodeId"
    post:
      tags: [épisodes]
      operationId: markPlayed
      summary: Marquer comme écouté (template `mark-played`)
      responses:
        "204": { description: Épisode écouté }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [épisodes]
      operationId: markUnplayed
      summary: Marquer comme non écouté (template `mark-unplayed`)
      responses:
        "204": { description: Épisode remis à l'état nouveau }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /episodes/{episodeId}/kept:
    parameters:
      - $ref: "#/components/parameters/episodeId"
    put:
      tags: [épisodes]
      operationId: keepEpisode
      summary: Garder l'épisode (template `keep`) ; son fichier sur le serveur n'est jamais purgé
      responses:
        "204": { description: Épisode gardé }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [épisodes]
      operationId: unkeepEpisode
      summary: Ne plus garder l'épisode (template `unkeep`)
      responses:
        "204": { description: Épisode plus gardé }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /episodes/{episodeId}/download:
    parameters:
      - $ref: "#/components/parameters/episodeId"
    post:
      tags: [épisodes]
      operationId: downloadEpisode
      summary: Demander au serveur de télécharger le fichier (template `download`)
      description: |
        Le fichier est mutualisé : téléchargé une fois pour tous les utilisateurs, en arrière-plan.
        `fileStatus` passe à `PENDING`, `DOWNLOADING` puis `READY` (ou `FAILED` ; une nouvelle demande réessaie).
      responses:
        "202": { description: Téléchargement demandé }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /episodes/{episodeId}/shares:
    parameters:
      - $ref: "#/components/parameters/episodeId"
    post:
      tags: [partages]
      operationId: recommendEpisode
      summary: Recommander un épisode à quelqu'un (template `recommend`)
      description: Une recommandation est un partage en lecture seule (`READ`), avec un message facultatif. Recommander à nouveau remplace le message.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecommendationRequest" }
      responses:
        "200":
          description: Recommandation enregistrée
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Share" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/Share" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /subscriptions/{subscriptionId}/shares:
    parameters:
      - $ref: "#/components/parameters/subscriptionId"
    get:
      tags: [partages]
      operationId: listSubscriptionShares
      summary: Avec qui l'abonnement est partagé (propriétaire)
      responses:
        "200":
          description: Partages de l'abonnement
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/SubscriptionShares" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/SubscriptionShares" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [partages]
      operationId: shareSubscription
      summary: Partager l'abonnement (propriétaire, template `share`)
      description: |
        `READ` : voir l'abonnement et sa note, écouter ses épisodes. `WRITE` : modifier aussi la note
        et le téléchargement automatique. Partager à nouveau avec la même personne change la permission
        et le message.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareRequest" }
      responses:
        "200":
          description: Partage enregistré
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Share" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/Share" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /shared:
    get:
      tags: [partages]
      operationId: listSharedWithMe
      summary: Ce que les autres partagent avec l'utilisateur, du plus récent au plus ancien
      responses:
        "200":
          description: Partages reçus, chacun avec ce qui est partagé
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/SharedWithMe" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/SharedWithMe" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /shares/{shareId}:
    parameters:
      - $ref: "#/components/parameters/shareId"
    get:
      tags: [partages]
      operationId: getShare
      summary: Un partage, pour son propriétaire, son destinataire ou un administrateur
      responses:
        "200":
          description: Partage, avec ce qui est partagé
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Share" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/Share" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [partages]
      operationId: changeSharePermission
      summary: Changer la permission d'un partage (propriétaire, template `change-permission`)
      description: Une recommandation d'épisode reste en lecture seule.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareUpdate" }
      responses:
        "200":
          description: Partage modifié
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Share" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/Share" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [partages]
      operationId: deleteShare
      summary: Ne plus partager (propriétaire) ou refuser un partage reçu (destinataire), template `unshare`
      responses:
        "204": { description: Partage supprimé }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /episodes/{episodeId}/audio:
    parameters:
      - $ref: "#/components/parameters/episodeId"
    get:
      tags: [épisodes]
      operationId: getEpisodeAudio
      summary: Fichier audio de l'épisode
      description: |
        Sert le fichier mutualisé du serveur quand il est téléchargé (`fileStatus: READY`), avec
        les requêtes partielles (`Range`) pour avancer dans l'épisode ; sinon redirige vers le
        fichier d'origine (enclosure RSS). Les clients utilisent toujours le lien `audio` de
        l'épisode : il est **signé** (`expires`, `signature`) et valable 24 heures, car les
        lecteurs audio (Media3, AVPlayer, JavaFX, `<audio>`) n'envoient pas de jeton (ADR 0008).
        Sans signature, une session ou un jeton donne aussi accès.
      security: [{}, { bearer: [] }, { session: [] }]
      parameters:
        - name: expires
          in: query
          description: Fin de validité du lien (secondes depuis l'époque Unix), fixée par le serveur.
          schema: { type: integer }
        - name: signature
          in: query
          description: HMAC-SHA256 de l'épisode et de `expires`, par le serveur.
          schema: { type: string }
      responses:
        "200":
          description: Fichier du serveur
          content:
            audio/*:
              schema: { type: string, format: binary }
        "206":
          description: Partie du fichier demandée par `Range`
          content:
            audio/*:
              schema: { type: string, format: binary }
        "302":
          description: Redirection vers le fichier audio
          headers:
            Location:
              schema: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "Lien signé expiré (`type` : `/problems/audio-link-expired`) : relire l'épisode pour en obtenir un nouveau."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }

  /queue:
    get:
      tags: [file d'attente]
      operationId: getQueue
      summary: File d'attente de l'utilisateur (« à suivre »), dans l'ordre d'écoute
      responses:
        "200":
          description: File d'attente
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Queue" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/Queue" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [file d'attente]
      operationId: enqueue
      summary: Ajouter un épisode à la file (template `enqueue`)
      description: |
        Sans `position`, l'épisode va à la fin ; `0` le place en tête (« lire ensuite »).
        Un épisode déjà dans la file y change de place.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueueRequest" }
      responses:
        "200":
          description: File d'attente modifiée
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Queue" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/Queue" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [file d'attente]
      operationId: clearQueue
      summary: Vider la file (template `clear-queue`)
      responses:
        "204": { description: File vidée }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /queue/{episodeId}:
    parameters:
      - $ref: "#/components/parameters/episodeId"
    put:
      tags: [file d'attente]
      operationId: moveInQueue
      summary: Déplacer un épisode de la file (template `move`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueueMove" }
      responses:
        "200":
          description: File d'attente modifiée
          content:
            application/hal+json:
              schema: { $ref: "#/components/schemas/Queue" }
            application/prs.hal-forms+json:
              schema: { $ref: "#/components/schemas/Queue" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [file d'attente]
      operationId: dequeue
      summary: Retirer un épisode de la file (template `dequeue`)
      responses:
        "204": { description: Épisode retiré de la file }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Jeton d'appareil obtenu par `POST /auth/tokens`.
    session:
      type: apiKey
      in: cookie
      name: podcast_session
      description: Session du client léger (formulaire `/login`).

  parameters:
    offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    episodeId:
      name: episodeId
      in: path
      required: true
      schema: { type: string }
    podcastId:
      name: podcastId
      in: path
      required: true
      schema: { type: string }
    subscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: string }
    userId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    deviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string }
    shareId:
      name: shareId
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Paramètre invalide
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Authentification absente, invalide ou révoquée
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: |
        Action refusée sur une ressource que l'utilisateur peut voir (ADR 0005, 0009) : abonnement
        partagé en lecture seule, gestion des comptes sans être administrateur, etc. Aussi : requête
        authentifiée par session (client léger) sans l'en-tête `HX-Request`, refusée pour se
        protéger du CSRF (ne concerne pas les jetons Bearer).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Ressource inexistante ou non visible pour l'utilisateur
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    FeedRejected:
      description: |
        Le flux est refusé. `type` en donne la raison :
        `/problems/invalid-feed-url` (adresse invalide ou non http(s)),
        `/problems/forbidden-feed-address` (réseau privé, protection SSRF),
        `/problems/feed-unreachable`, `/problems/not-a-feed` (pas un flux RSS),
        `/problems/feed-too-large`. Un champ `feedUrl` vide donne un 422 sans `type` particulier.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: Corps de requête invalide
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyAttempts:
      description: |
        Trop de mots de passe erronés pour ce compte depuis cette adresse (`type` : `/problems/too-many-attempts`).
        `Retry-After` donne le nombre de secondes à attendre.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Link:
      type: object
      required: [href]
      properties:
        href: { type: string }
        templated: { type: boolean }
        type: { type: string, description: Type de la ressource liée (transcriptions, chapitres). }
        hreflang: { type: string }
      additionalProperties: false

    Template:
      description: Action HAL-FORMS.
      type: object
      required: [method, target]
      properties:
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        target: { type: string }
        contentType: { type: string, const: application/json }
        properties:
          type: array
          items: { $ref: "#/components/schemas/TemplateProperty" }
      additionalProperties: false

    TemplateProperty:
      type: object
      required: [name]
      properties:
        name: { type: string }
        required: { type: boolean }
        readOnly: { type: boolean }
        type: { type: string }
        value: {}
        min: { type: number }
        max: { type: number }
        regex: { type: string }
        prompt: { type: string }
        options: { type: object }
      additionalProperties: false

    Problem:
      description: Problem Details (RFC 9457).
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
            additionalProperties: false
      additionalProperties: false

    Root:
      type: object
      required: [name, apiVersion, _links]
      properties:
        name: { type: string, description: Nom affiché du serveur }
        apiVersion: { type: integer, const: 1 }
        _links:
          type: object
          required: [self, tokens]
          properties:
            self: { $ref: "#/components/schemas/Link" }
            tokens: { $ref: "#/components/schemas/Link" }
            me: { $ref: "#/components/schemas/Link" }
            subscriptions: { $ref: "#/components/schemas/Link" }
            queue: { $ref: "#/components/schemas/Link" }
            users: { $ref: "#/components/schemas/Link" }
            shared: { $ref: "#/components/schemas/Link" }
            episodes: { $ref: "#/components/schemas/Link" }
            episode:
              description: "Gabarit `/episodes/{id}` : un épisode à partir de son identifiant."
              $ref: "#/components/schemas/Link"
            podcast:
              description: "Gabarit `/podcasts/{id}` : un podcast à partir de son identifiant."
              $ref: "#/components/schemas/Link"
            search:
              description: "Gabarit `/search{?q}` : recherche dans les annuaires."
              $ref: "#/components/schemas/Link"
          additionalProperties: false
        _embedded:
          description: Accueil de l'utilisateur connecté.
          type: object
          required: [resume, latest]
          properties:
            resume:
              description: Épisodes en cours, du plus récemment écouté au plus ancien.
              type: array
              items: { $ref: "#/components/schemas/Episode" }
            latest:
              description: Derniers épisodes des abonnements.
              type: array
              items: { $ref: "#/components/schemas/Episode" }
          additionalProperties: false
        _templates:
          type: object
          properties:
            create-token: { $ref: "#/components/schemas/Template" }
          additionalProperties: false
      additionalProperties: false

    TokenRequest:
      type: object
      required: [username, password, deviceName]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
        deviceName: { type: string, minLength: 1, maxLength: 100 }
      additionalProperties: false

    Token:
      type: object
      required: [token, deviceName, createdAt, _links]
      properties:
        token: { type: string, description: "À envoyer dans `Authorization: Bearer`." }
        deviceName: { type: string }
        createdAt: { type: string, format: date-time }
        _links:
          type: object
          required: [self, me]
          properties:
            self: { $ref: "#/components/schemas/Link" }
            me: { $ref: "#/components/schemas/Link" }
          additionalProperties: false
      additionalProperties: false

    User:
      description: Un compte. `/me` ajoute les liens `devices` et `users`.
      type: object
      required: [id, username, displayName, role, _links]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [USER, ADMIN] }
        _links:
          type: object
          required: [self]
          properties:
            self: { $ref: "#/components/schemas/Link" }
            devices: { $ref: "#/components/schemas/Link" }
            users: { $ref: "#/components/schemas/Link" }
          additionalProperties: false
        _templates:
          type: object
          properties:
            logout: { $ref: "#/components/schemas/Template" }
            update-profile: { $ref: "#/components/schemas/Template" }
            change-password: { $ref: "#/components/schemas/Template" }
            update-user: { $ref: "#/components/schemas/Template" }
            reset-password: { $ref: "#/components/schemas/Template" }
            delete-user: { $ref: "#/components/schemas/Template" }
          additionalProperties: false
      additionalProperties: false

    UserCollection:
      type: object
      required: [count, _links, _embedded]
      properties:
        count: { type: integer, minimum: 0 }
        _links:
          type: object
          required: [self]
          properties:
            self: { $ref: "#/components/schemas/Link" }
          additionalProperties: false
        _embedded:
          type: object
          required: [users]
          properties:
            users:
              type: array
              items: { $ref: "#/components/schemas/User" }
          additionalProperties: false
        _templates:
          type: object
          properties:
            create-user: { $ref: "#/components/schemas/Template" }
          additionalProperties: false
      additionalProperties: false

    UserCreate:
      type: object
      required: [username, displayName, password]
      properties:
        username: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{2,31}$" }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 8 }
        role: { type: string, enum: [USER, ADMIN], default: USER }
      additionalProperties: false

    UserUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        role: { type: string, enum: [USER, ADMIN] }
      additionalProperties: false

    ProfileUpdate:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
      additionalProperties: false

    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8 }
      additionalProperties: false

    PasswordReset:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8 }
      additionalProperties: false

    Device:
      type: object
      required: [id, name, createdAt, lastUsedAt, current, _links]
      properties:
        id: { type: string }
        name: { type: string, description: Nom donné par l'appareil à la connexion }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        current: { type: boolean, description: L'appareil qui fait la requête }
        _links:
          type: object
          required: [self]
          properties:
            self: { $ref: "#/components/schemas/Link" }
          additionalProperties: false
        _templates:
          type: object
          properties:
            revoke: { $ref: "#/components/schemas/Template" }
          additionalProperties: false
      additionalProperties: false

    DeviceCollection:
      type: object
      required: [count, _links, _embedded]
      properties:
        count: { type: integer, minimum: 0 }
        _links:
          type: object
          required: [self]
          properties:
            self: { $ref: "#/components/schemas/Link" }
          additionalProperties: false
        _embedded:
          type: object
          required: [devices]
          properties:
            devices:
              type: array
              items: { $ref: "#/components/schemas/Device" }
          additionalProperties: false
      additionalProperties: false

    Podcast:
      type: object
      required: [id, title, author, feedUrl, artworkUrl, description, websiteUrl, language, refreshStatus, refreshedAt, _links]
      properties:
        id: { type: string }
        title: { type: string }
        author: { type: string }
        feedUrl: { type: string, format: uri }
        artworkUrl: { type: [string, "null"], format: uri }
        description: { type: string }
        websiteUrl: { type: [string, "null"], format: uri }
        language: { type: [string, "null"] }
        refreshStatus: { $ref: "#/components/schemas/RefreshStatus" }
        refreshedAt:
          description: Dernière lecture réussie du flux par le serveur.
          type: [string, "null"]
          format: date-time
        _links:
          type: object
          required: [self, episodes, feed]
          properties:
            self: { $ref: "#/components/schemas/Link" }
            episodes:
              description: "Gabarit `/podcasts/{id}/episodes{?offset,limit}`."
              $ref: "#/components/schemas/Link"
            feed: { $ref: "#/components/schemas/Link" }
          additionalProperties: false
        _templates:
          type: object
          properties:
            refresh: { $ref: "#/components/schemas/Template" }
          additionalProperties: false
      additionalProperties: false

    Subscription:
      type: object
      required: [id, note, subscribedAt, autoDownload, access, ownerName, _links, _embedded]
      properties:
        id: { type: string }
        note: { type: [string, "null"], description: Annotation de l'utilisateur }
        subscribedAt: { type: string, format: date-time }
        autoDownload:
          type: boolean
          description: Le serveur télécharge les nouveaux épisodes de ce podcast pour cet utilisateur.
        access:
          description: "Droits de l'utilisateur : `OWNER` (le sien, ou administrateur), `WRITE` ou `READ` (partagé avec lui)."
          type: string
          enum: [OWNER, WRITE, READ]
        ownerName: { type: [string, "null"], description: "Qui l'a partagé ; null pour ses propres abonnements." }
        _links:
          type: object
          required: [self, podcast]
          properties:
            self: { $ref: "#/components/schemas/Link" }
            podcast: { $ref: "#/components/schemas/Link" }
            shares:
              description: Avec qui l'abonnement est partagé (propriétaire seulement).
              $ref: "#/components/schemas/Link"
          additionalProperties: false
        _embedded:
          type: object
          required: [podcast]
          properties:
            podcast: { $ref: "#/components/schemas/Podcast" }
          additionalProperties: false
        _templates:
          type: object
          properties:
            update: { $ref: "#/components/schemas/Template" }
            unsubscribe: { $ref: "#/components/schemas/Template" }
            share: { $ref: "#/components/schemas/Template" }
            subscribe: { $ref: "#/components/schemas/Template" }
          additionalProperties: false
      additionalProperties: false

    Share:
      description: Ce qu'un utilisateur partage avec un autre (ADR 0009).
      type: object
      required: [id, type, permission, message, createdAt, owner, grantee, _links]
      properties:
        id: { type: string }
        type: { type: string, enum: [SUBSCRIPTION, EPISODE, PLAYLIST] }
        permission: { type: string, enum: [READ, WRITE] }
        message: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        owner: { $ref: "#/components/schemas/UserSummary" }
        grantee: { $ref: "#/components/schemas/UserSummary" }
        _links:
          type: object
          required: [self]
          properties:
            self: { $ref: "#/components/schemas/Link" }
            subscription: { $ref: "#/components/schemas/Link" }
            episode: { $ref: "#/components/schemas/Link" }
            playlist: { $ref: "#/components/schemas/Link" }
          additionalProperties: false
        _embedded:
          description: Ce qui est partagé, tel que l'utilisateur le voit.
          type: object
          properties:
            subscription: { $ref: "#/components/schemas/Subscription" }
            episode: { $ref: "#/components/schemas/Episode" }
          additionalProperties: false
        _templates:
          type: object
          properties:
            unshare: { $ref: "#/components/schemas/Template" }
            change-permission: { $ref: "#/components/schemas/Template" }
          additionalProperties: false
      additionalProperties: false

    UserSummary:
      type: object
      required: [id, username, displayName, role]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [USER, ADMIN] }
      additionalProperties: false

    SubscriptionShares:
      type: object
      required: [count, _links, _embedded]
      properties:
        count: { type: integer, minimum: 0 }
        _links:
          type: object
          required: [self, subscription]
          properties:
            self: { $ref: "#/components/schemas/Link" }
            subscription: { $ref: "#/components/schemas/Link" }
          additionalProperties: false
        _embedded:
          type: object
          required: [shares]
          properties:
            shares:
              type: array
              items: { $ref: "#/components/schemas/Share" }
          additionalProperties: false
        _templates:
          type: object
          properties:
            share: { $ref: "#/components/schemas/Template" }
          additionalProperties: false
      additionalProperties: false

    SharedWithMe:
      type: object
      required: [count, _links, _embedded]
      properties:
        count: { type: integer, minimum: 0 }
        _links:
          type: object
          required: [self]
          properties:
            self: { $ref: "#/components/schemas/Link" }
          additionalProperties: false
        _embedded:
          type: object
          required: [shares]
          properties:
            shares:
              type: array
              items: { $ref: "#/components/schemas/Share" }
          additionalProperties: false
      additionalProperties: false

    ShareRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: string, description: Le compte avec qui partager (voir `/users`). }
        permission: { type: string, enum: [READ, WRITE], default: READ }
        message: { type: [string, "null"], maxLength: 500 }
      additionalProperties: false

    RecommendationRequest:
      type: object
      required: [userId]
      properties:
        userId: { type: string }
        message: { type: [string, "null"], maxLength: 500 }
      additionalProperties: false

    ShareUpdate:
      type: object
      required: [permission]
      properties:
        permission: { type: string, enum: [READ, WRITE] }
      additionalProperties: false

    SubscriptionCollection:
      type: object
      required: [count, _links, _embedded]
      properties:
        count: { type: integer, minimum: 0 }
        _links:
          type: object
          required: [self, opml]
          properties:
            self: { $ref: "#/components/schemas/Link" }
            opml:
              description: Export (GET) et import (POST) OPML.
              $ref: "#/components/schemas/Link"
          additionalProperties: false
        _embedded:
          type: object
          required: [subscriptions]
          properties:
            subscriptions:
              type: array
              items: { $ref: "#/components/schemas/Subscription" }
          additionalProperties: false
        _templates:
          type: object
          properties:
            subscribe: { $ref: "#/components/schemas/Template" }
          additionalProperties: false
      additionalProperties: false

    OpmlImportReport:
      type: object
      required: [imported, alreadySubscribed, failed, _links]
      properties:
        imported: { type: integer, minimum: 0 }
        alreadySubscribed: { type: integer, minimum: 0 }
        failed:
          type: array
          items:
            type: object
            required: [feedUrl, reason]
            properties:
              feedUrl: { type: string }
              reason: { type: string, description: "Code du refus : `invalid-feed-url`, `forbidden-feed-address`…" }
            additionalProperties: false
        _links:
          type: object
          required: [subscriptions]
          properties:
            subscriptions: { $ref: "#/components/schemas/Link" }
          additionalProperties: false
      additionalProperties: false

    SearchResults:
      type: object
      required: [query, count, sources, _links, _embedded]
      properties:
        query: { type: string }
        count: { type: integer, minimum: 0 }
        sources:
          description: Annuaires qui ont répondu.
          type: array
          items: { type: string, enum: [apple, podcastindex] }
        _links:
          type: object
          required: [self]
          properties:
            self: { $ref: "#/components/schemas/Link" }
          additionalProperties: false
        _embedded:
          type: object
          required: [results]
          properties:
            results:
              type: array
              items: { $ref: "#/components/schemas/SearchResult" }
          additionalProperties: false
      additionalProperties: false

    SearchResult:
      type: object
      required: [title, author, feedUrl, artworkUrl, description, source, subscribed, _links]
      properties:
        title: { type: string }
        author: { type: string }
        feedUrl: { type: string }
        artworkUrl: { type: [string, "null"] }
        description: { type: string }
        source: { type: string, enum: [apple, podcastindex] }
        subscribed: { type: boolean, description: L'utilisateur suit déjà ce flux. }
        _links:
          type: object
          required: [feed]
          properties:
            feed: { $ref: "#/components/schemas/Link" }
          additionalProperties: false
        _templates:
          type: object
          properties:
            subscribe: { $ref: "#/components/schemas/Template" }
          additionalProperties: false
      additionalProperties: false

    SubscriptionRequest:
      type: object
      required: [feedUrl]
      properties:
        feedUrl: { type: string, description: "Adresse du flux RSS ; `https://` est ajouté s'il manque." }
      additionalProperties: false

    SubscriptionUpdate:
      type: object
      properties:
        note: { type: [string, "null"], maxLength: 2000 }
        autoDownload: { type: boolean }
      additionalProperties: false

    EpisodeStatus:
      type: string
      enum: [NEW, IN_PROGRESS, PLAYED]

    FileStatus:
      description: "Fichier audio mutualisé sur le serveur : absent, en attente, en cours, prêt ou en échec."
      type: string
      enum: [NONE, PENDING, DOWNLOADING, READY, FAILED]

    RefreshStatus:
      description: "Dernière lecture du flux : en attente (abonnement tout juste importé), réussie ou en échec."
      type: string
      enum: [PENDING, OK, FAILED]

    Episode:
      description: Un épisode tel que le voit l'utilisateur connecté (catalogue + état d'écoute).
      type: object
      required: [id, podcastId, title, description, publishedAt, durationSeconds, positionSeconds, status, kept, fileStatus, inQueue, _links, _embedded]
      properties:
        id: { type: string }
        podcastId: { type: string }
        title: { type: string }
        description: { type: string }
        publishedAt: { type: string, format: date-time }
        durationSeconds: { type: integer, minimum: 0, description: "0 si le flux ne la donne pas." }
        positionSeconds: { type: integer, minimum: 0 }
        status: { $ref: "#/components/schemas/EpisodeStatus" }
        kept:
          type: boolean
          description: Gardé par l'utilisateur ; son fichier sur le serveur n'est jamais purgé.
        fileStatus: { $ref: "#/components/schemas/FileStatus" }
        inQueue: { type: boolean, description: Dans la file d'attente de l'utilisateur. }
        _links:
          type: object
          required: [self, podcast, audio]
          properties:
            self: { $ref: "#/components/schemas/Link" }
            podcast: { $ref: "#/components/schemas/Link" }
            audio:
              description: Fichier audio, par un lien signé valable 24 heures, à donner tel quel au lecteur.
              $ref: "#/components/schemas/Link"
            chapters:
              description: "Podcast 2.0 : chapitres annoncés par le flux (JSON Chapters)."
              $ref: "#/components/schemas/Link"
            transcript:
              description: "Podcast 2.0 : transcriptions annoncées par le flux, une par format ou par langue."
              type: array
              items: { $ref: "#/components/schemas/Link" }
          additionalProperties: false
        _embedded:
          type: object
          required: [podcast]
          properties:
            podcast: { $ref: "#/components/schemas/Podcast" }
          additionalProperties: false
        _templates:
          description: |
            Actions possibles : `update-progress` toujours, `mark-played` si l'épisode n'est pas écouté,
            `mark-unplayed` s'il n'est pas nouveau, `keep` ou `unkeep` selon `kept`,
            `download` tant que le serveur n'a pas le fichier (`NONE` ou `FAILED`),
            `enqueue` hors de la file, `dequeue` et `move` dans la file.
          type: object
          properties:
            update-progress: { $ref: "#/components/schemas/Template" }
            mark-played: { $ref: "#/components/schemas/Template" }
            mark-unplayed: { $ref: "#/components/schemas/Template" }
            keep: { $ref: "#/components/schemas/Template" }
            unkeep: { $ref: "#/components/schemas/Template" }
            download: { $ref: "#/components/schemas/Template" }
            enqueue: { $ref: "#/components/schemas/Template" }
            dequeue: { $ref: "#/components/schemas/Template" }
            move: { $ref: "#/components/schemas/Template" }
            recommend: { $ref: "#/components/schemas/Template" }
          additionalProperties: false
      additionalProperties: false

    EpisodeCollection:
      type: object
      required: [count, total, offset, limit, _links, _embedded]
      properties:
        count: { type: integer, minimum: 0, description: Nombre d'épisodes dans cette page }
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        _links:
          type: object
          required: [self]
          properties:
            self: { $ref: "#/components/schemas/Link" }
            next: { $ref: "#/components/schemas/Link" }
            prev: { $ref: "#/components/schemas/Link" }
          additionalProperties: false
        _embedded:
          type: object
          required: [episodes]
          properties:
            episodes:
              type: array
              items: { $ref: "#/components/schemas/Episode" }
          additionalProperties: false
      additionalProperties: false

    ProgressRequest:
      type: object
      required: [positionSeconds]
      properties:
        positionSeconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Peut dépasser la durée donnée par le flux, souvent approximative.
      additionalProperties: false

    Queue:
      description: File d'attente de l'utilisateur (« à suivre »). Un épisode marqué comme écouté en sort.
      type: object
      required: [count, _links, _embedded]
      properties:
        count: { type: integer, minimum: 0 }
        _links:
          type: object
          required: [self]
          properties:
            self: { $ref: "#/components/schemas/Link" }
          additionalProperties: false
        _embedded:
          type: object
          required: [episodes]
          properties:
            episodes:
              type: array
              items: { $ref: "#/components/schemas/Episode" }
          additionalProperties: false
        _templates:
          type: object
          properties:
            clear-queue: { $ref: "#/components/schemas/Template" }
          additionalProperties: false
      additionalProperties: false

    QueueRequest:
      type: object
      required: [episodeId]
      properties:
        episodeId: { type: string }
        position:
          type: [integer, "null"]
          minimum: 0
          description: "Place dans la file : 0 en tête ; absente ou au-delà de la fin, en dernier."
      additionalProperties: false

    QueueMove:
      type: object
      required: [position]
      properties:
        position: { type: integer, minimum: 0, description: Nouvelle place ; au-delà de la fin, en dernier. }
      additionalProperties: false

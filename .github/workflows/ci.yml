name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-android:
    name: JVM + Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests (shared JVM, desktop, server, CLI)
        run: ./gradlew :shared:jvmTest :composeApp:desktopTest :server:test :cli:test

      - name: Android build
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload responsive snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: composeApp/build/snapshots/
